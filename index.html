<style>
:root{
  /* Cores oficiais do brandbook (Estúdio Amare). Lavanda Rosa confirmada no logotipo SVG oficial. */
  --lime:#CCF656;--blue:#4559E0;--pump:#FE7626;--mik:#FEC42E;--lav:#F4C4EB;--alab:#E5E5DC;--black:#101010;
  --bg:var(--alab);--fg:var(--black);--line:var(--black);--sub:#45453F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--fg:var(--alab);--line:var(--alab);--sub:#B9B9B0}}
:root[data-theme="dark"]{--bg:#101010;--fg:var(--alab);--line:var(--alab);--sub:#B9B9B0}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1020px;margin:0 auto;padding:14px 14px 44px;display:grid;gap:18px}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:500;font-size:.78rem}
.disp{font-family:"Bricolage Grotesque",Georgia,sans-serif}

/* Painel de abertura */
.panel{position:relative;overflow:hidden;background:var(--black);color:var(--alab);border-radius:32px;padding:22px 20px 26px;box-shadow:inset 0 0 0 1.5px rgba(229,229,220,.2);
  background-image:radial-gradient(rgba(229,229,220,.13) 1px,transparent 1.3px);background-size:18px 18px}
.panel>*{position:relative;z-index:1}
.deco{position:absolute!important;z-index:0!important;pointer-events:none;transition:transform .3s ease-out}
.d1{width:150px;height:auto;top:-30px;right:-34px;animation:spin 48s linear infinite}
.d2{width:104px;bottom:-6px;right:6px}
.d3{width:84px;bottom:-30px;left:-30px;color:var(--lav)}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{display:flex;align-items:center;width:fit-content;max-width:100%;min-height:44px}
.logo img{height:50px;width:auto;max-width:100%;display:block}
.logo .name{font-size:1.15rem;font-weight:800;color:var(--alab)}
.bubble{margin-top:18px;display:inline-block;max-width:100%;background:var(--blue);color:#fff;font:inherit;font-weight:500;font-size:.95rem;line-height:1.3;text-align:left;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;position:relative;transition:transform .15s}
.bubble::after{content:"";position:absolute;left:28px;bottom:-9px;border:9px solid transparent;border-top-color:var(--blue);border-bottom:0;border-left-width:4px}
@media (hover:hover){.bubble:hover{transform:rotate(-1deg) scale(1.02)}}.bubble:active{transform:scale(.97)}
.lead{margin-top:26px;font-size:clamp(2.1rem,9.5vw,3.3rem);line-height:.98;letter-spacing:-.03em;font-weight:800;max-width:12ch}
.sub{margin-top:14px;max-width:36ch;font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding:0}
.chips li{list-style:none;display:flex;align-items:center;gap:7px;font-size:.84rem;font-weight:700;padding:6px 12px 6px 8px;border-radius:999px;background:var(--c);color:var(--t,var(--black));transition:transform .2s}
@media (hover:hover){.chips li:hover{transform:translateY(-2px)}}
.chips svg{width:18px;height:18px;color:var(--e,var(--black));transition:transform .5s}
.chips li:hover svg{transform:rotate(120deg)}

/* Grupos e cartões */
.group{display:grid;gap:12px}
.ghead{display:flex;align-items:baseline;gap:10px;margin:8px 2px 0}
.ghead .mono{color:var(--sub)}
.ghead h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;min-height:132px;padding:16px;border-radius:26px;background:var(--c);color:var(--t,var(--black));text-decoration:none;border:2px solid transparent;transition:transform .2s,box-shadow .2s}
.card.wide{grid-column:span 2;min-height:116px}
.card.hero{min-height:168px}
.card.outline{--e:currentColor;background:transparent;color:var(--fg);border-color:var(--line)}
.card h3{font-size:1.4rem;font-weight:800;line-height:1.05;margin-top:auto;padding-right:44px}
.card.hero h3{font-size:2rem}
.card p{font-size:.88rem;max-width:30ch}
.card .el{position:absolute;top:14px;right:14px;width:40px;height:40px;color:var(--e,var(--black));transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.card.hero .el{width:54px;height:54px}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 10px 0 -2px var(--line)}
.card:hover .el{transform:rotate(90deg) scale(1.15)}}
.card:active{transform:scale(.97);box-shadow:none}
.card:focus-visible,.bubble:focus-visible,.share:focus-visible,.theme:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.cb{--c:var(--blue);--t:#fff;--e:var(--lime)}.cp{--c:var(--pump);--e:var(--black)}.cl{--c:var(--lime);--e:var(--blue)}
.cv{--c:var(--lav);--e:var(--blue)}.cm{--c:var(--mik);--e:var(--black)}.cx{--c:var(--black);--t:var(--alab);--e:var(--lime)}
.cx{border-color:var(--alab)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .cx{border-color:transparent}}
:root[data-theme="light"] .cx{border-color:transparent}
footer{text-align:center;padding-top:6px}
.share{font:inherit;font-weight:700;color:var(--fg);background:transparent;border:2px solid var(--line);border-radius:999px;padding:11px 22px;cursor:pointer;transition:background .2s,color .2s}
.share:hover{background:var(--fg);color:var(--bg)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.theme{font:inherit;font-weight:700;color:var(--fg);background:transparent;border:2px solid var(--line);border-radius:999px;padding:11px 22px;cursor:pointer;transition:background .2s,color .2s}
.theme:hover{background:var(--fg);color:var(--bg)}
.legal{margin-top:6px;font-size:.78rem;color:var(--sub)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{height:1.4em;margin-top:10px;font-size:.9rem;color:var(--sub)}

/* Entrada suave */
.js .rv:not(.in){opacity:0;transform:translateY(14px)}
.rv{transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i,0)*60ms)}
.rv.card{transition:opacity .5s ease,transform .2s,box-shadow .2s}

@media (min-width:900px){
  .wrap{grid-template-columns:5fr 6fr;gap:28px;align-items:start;padding-top:28px}
  .panel{position:sticky;top:20px;padding:30px 28px 34px;min-height:560px}
  .links{display:grid;gap:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .rv:not(.in){opacity:1;transform:none}
}
</style>
</head>

      {titulo:"Instagram",desc:"Dia a dia e conteúdo.",url:"https://www.instagram.com/adeliamodesto_/",cor:"contorno",acento:"laranja",elemento:"estrela"},
      {titulo:"TikTok",desc:"Vídeos curtos.",url:"https://www.tiktok.com/@adeliamodesto",cor:"contorno",elemento:"asterisco"},
      {titulo:"Pinterest",desc:"Referências e inspirações.",url:"https://www.pinterest.com/adeliamodesto/",cor:"contorno",acento:"laranja",elemento:"flor",largo:true}
    ]}
  ]
};
</script>

<script>
(function(){
  document.documentElement.classList.add("js");
  var COR={azul:"cb",laranja:"cp",lime:"cl",lavanda:"cv",amarelo:"cm",preto:"cx",contorno:"outline"};
  var EL={espiral:"spiral",asterisco:"aster",onda:"wave",flor:"flower",estrela:"star"};
  var CHIP={azul:["#4559E0","#fff","#CCF656"],laranja:["#FE7626","#101010","#101010"],lime:["#CCF656","#101010","#4559E0"],lavanda:["#F4C4EB","#101010","#4559E0"],amarelo:["#FEC42E","#101010","#101010"],preto:["#101010","#E5E5DC","#CCF656"]};
  var ACC={azul:"#4559E0",laranja:"#FE7626"};
  var NS="http://www.w3.org/2000/svg";
  function $(id){return document.getElementById(id)}
  function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function icon(name,cls){var s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 40 40");s.setAttribute("aria-hidden","true");if(cls)s.setAttribute("class",cls);var u=document.createElementNS(NS,"use");u.setAttribute("href","#"+(EL[name]||"star"));s.appendChild(u);return s}
  function safe(u){return /^(https:\/\/|mailto:)/i.test(u)?u:"#"}

  // espiral por matemática
  var d="",a,r;for(var i=0;i<=90;i++){a=i*.19;r=1.2+a*1.05;d+=(i?"L":"M")+(20+r*Math.cos(a)).toFixed(1)+" "+(20+r*Math.sin(a)).toFixed(1)}
  $("spd").setAttribute("d",d);

  // logo ou nome
  var lg=$("logo");
  if(SITE.logo){var im=mk("img");im.src=SITE.logo;im.alt=SITE.nome;lg.appendChild(im)}
  else{lg.appendChild(mk("span","name disp",SITE.nome))}

  // apresentação
  $("lead").textContent=SITE.titulo;
  $("sub").textContent=SITE.resumo;$("sub").hidden=!SITE.resumo;
  var ch=$("chips");
  SITE.areas.forEach(function(x){var li=mk("li",null,x.t),c=CHIP[x.cor]||CHIP.amarelo;li.style.setProperty("--c",c[0]);li.style.setProperty("--t",c[1]);li.style.setProperty("--e",c[2]);li.insertBefore(icon(x.el),li.firstChild);ch.appendChild(li)});

  // balão
  var h=new Date().getHours(),g=h<5?"Boa madrugada":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
  var falas=SITE.falas.slice();falas[0]=g+"! "+falas[0];
  var n=0,b=$("bubble");b.textContent=falas[0];b.title="Toque para ver outra mensagem";
  b.addEventListener("click",function(){n=(n+1)%falas.length;b.textContent=falas[n]});

  // grupos e cartões
  var root=$("links"),idx=0;
  SITE.grupos.forEach(function(gr){
    var sec=mk("section","group");
    var hd=mk("div","ghead rv");hd.appendChild(mk("span","mono",gr.rotulo));hd.appendChild(mk("h2","disp",gr.titulo));sec.appendChild(hd);
    var grid=mk("div","grid");
    gr.links.forEach(function(l){
      var k=COR[l.cor]||"outline";
      var a=mk("a","card rv "+k+(l.largo?" wide":"")+(l.destaque?" hero":""));
      a.href=safe(l.url);
      if(/^https:/i.test(l.url)){a.target="_blank";a.rel="noopener me";a.setAttribute("aria-label",l.titulo+". "+l.desc+" Abre em nova aba.")}
      a.style.setProperty("--i",idx++%6);
      if(l.acento&&ACC[l.acento])a.style.setProperty("--e",ACC[l.acento]);
      a.appendChild(icon(l.elemento,"el"));
      a.appendChild(mk("h3","disp",l.titulo));
      a.appendChild(mk("p",null,l.desc));
      grid.appendChild(a);
    });
    sec.appendChild(grid);root.appendChild(sec);
  });

  // revelar ao rolar
  var items=document.querySelectorAll(".rv");
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.08});
    items.forEach(function(e){io.observe(e)});
  }else{items.forEach(function(e){e.classList.add("in")})}

  // paralaxe leve nos grafismos (só com ponteiro e sem preferência por menos movimento)
  var calm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!calm&&window.matchMedia("(hover:hover)").matches){
    var p=$("panel"),ds=p.querySelectorAll(".deco");
    p.addEventListener("pointermove",function(ev){var bb=p.getBoundingClientRect(),x=(ev.clientX-bb.left)/bb.width-.5,y=(ev.clientY-bb.top)/bb.height-.5;ds.forEach(function(el,i){var f=(i+1)*8;el.style.transform="translate("+(x*f).toFixed(1)+"px,"+(y*f).toFixed(1)+"px)"})});
    p.addEventListener("pointerleave",function(){ds.forEach(function(el){el.style.transform=""})});
  }

  // tema manual (claro/escuro), lembra a escolha neste aparelho
  var root_=document.documentElement,tb=$("theme"),tc=$("themecolor"),mq=window.matchMedia("(prefers-color-scheme: dark)");
  function store(v){try{if(v)localStorage.setItem("tema",v);else return localStorage.getItem("tema")}catch(e){}return null}
  function dark(){var t=root_.getAttribute("data-theme");return t?t==="dark":mq.matches}
  function paint(){var d=dark();tb.textContent=d?"Tema claro":"Tema escuro";tb.setAttribute("aria-pressed",d?"true":"false");if(tc)tc.setAttribute("content",d?"#101010":"#E5E5DC")}
  var saved=store();if(saved==="light"||saved==="dark")root_.setAttribute("data-theme",saved);
  paint();
  tb.addEventListener("click",function(){var nx=dark()?"light":"dark";root_.setAttribute("data-theme",nx);store(nx);paint()});
  if(mq.addEventListener)mq.addEventListener("change",paint);
  $("legal").textContent="© "+new Date().getFullYear()+" Adélia Modesto";

  // compartilhar
  var toast=$("toast");
  function say(m){toast.textContent=m;setTimeout(function(){toast.textContent=""},2500)}
  $("share").addEventListener("click",function(){
    var url=location.href.split("#")[0];
    if(navigator.share){navigator.share({title:SITE.nome+" | Links",url:url}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){say("Link copiado.")},function(){say("Não foi possível copiar.")})}
    else{say("Copie o endereço na barra do navegador.")}
  });
})();
</script>
</body>
</html>
